# Адрес, на котором слушает плагин.
# 127.0.0.1 — только с этого же компьютера (безопасно).
# 0.0.0.0 — с любого адреса (только если нужно, и токен должен быть секретным!).
bind: "127.0.0.1"
port: 25580

# Пароль для подключения из Python.
# Оставь пустым — при первом запуске сгенерируется случайный.
token: ""

# Сколько секунд ждать выполнения одной команды.
timeout-seconds: 10
